*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:#000;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bgd{position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 45% at 50% 0,rgba(255,255,255,.14),transparent 70%),radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:auto,30px 30px;-webkit-mask:radial-gradient(100% 90% at 50% 20%,#000 20%,transparent 80%);mask:radial-gradient(100% 90% at 50% 20%,#000 20%,transparent 80%)}
.gl{background:var(--g),rgba(18,18,24,.42);border:1px solid var(--b);box-shadow:var(--e),0 24px 60px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
nav{position:fixed;z-index:20;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(960px,calc(100% - 24px));display:flex;align-items:center;gap:10px;padding:7px 8px 7px 16px;border-radius:999px;animation:in .9s var(--sp) both}
@keyframes in{from{opacity:0;transform:translate(-50%,-24px) scale(.9)}}
nav b{display:flex;align-items:center;gap:9px;font-size:17px;letter-spacing:-.3px;margin-right:auto;white-space:nowrap}nav b i{width:30px;height:30px;background:var(--logo) center/contain no-repeat}
.lang{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.08)}.lang button{padding:7px 11px;border-radius:999px;border:0;background:none;color:var(--m);font:700 12px inherit;cursor:pointer}.lang button.on{background:#fff;color:#000}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;border-radius:999px;border:0;background:#fff;color:#000;font:700 16px inherit;text-decoration:none;cursor:pointer;transition:transform .4s var(--sp),box-shadow .3s;box-shadow:0 10px 40px rgba(255,255,255,.16)}
.btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 16px 50px rgba(255,255,255,.28)}.btn:active{transform:scale(.95)}.btn.s{padding:10px 20px;font-size:14px;box-shadow:none}.btn.g{background:rgba(255,255,255,.1);color:#fff;border:1px solid var(--b);box-shadow:none}
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:110px 22px 50px;gap:20px}
.logo{width:min(150px,38vw);aspect-ratio:1;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 14px 50px rgba(255,255,255,.25));animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
h1{font-size:clamp(40px,8vw,88px);line-height:1.02;letter-spacing:-.045em;max-width:900px;font-weight:700;background:linear-gradient(180deg,#fff 35%,#8a8a92);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:580px;color:var(--m);font-size:clamp(16px,2.3vw,20px);line-height:1.6}
.cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.demo{width:min(560px,100%);margin-top:20px;padding:18px;border-radius:34px;text-align:left}
.m{max-width:88%;padding:12px 18px;border-radius:24px;font-size:15px;line-height:1.55;margin-bottom:10px;animation:pop .6s var(--sp) both}
.m.u{margin-left:auto;background:#fff;color:#000;font-weight:500;border-bottom-right-radius:6px}.m.a{background:rgba(255,255,255,.07);border:1px solid var(--b);border-bottom-left-radius:6px;min-height:46px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}}
.cur::after{content:"";display:inline-block;width:7px;height:7px;margin-left:4px;border-radius:50%;background:#fff;animation:bl .9s infinite}@keyframes bl{50%{opacity:.2}}
section{max-width:1040px;margin:auto;padding:84px 22px}
h2{font-size:clamp(30px,5vw,52px);letter-spacing:-.035em;text-align:center;margin-bottom:14px}.lead{text-align:center;color:var(--m);margin:0 auto 44px;max-width:640px;line-height:1.7;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{position:relative;padding:28px 24px;border-radius:34px;transition:transform .5s var(--sp)}.card:hover{transform:translateY(-6px)}
.ic{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;font-size:22px;margin-bottom:16px;background:linear-gradient(135deg,#f2f3f7,#80838f);color:#000;box-shadow:inset 0 1px 0 #fff}
.card h3{font-size:19px;margin-bottom:7px}.card p{color:var(--m);line-height:1.6;font-size:15px}
.cmp{border-radius:34px;overflow:hidden;max-width:760px;margin:auto}
